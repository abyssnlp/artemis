mappings:
  - match: "airflow.scheduler.heartbeat"
    name: "airflow_scheduler_heartbeat"
    labels: {}

  - match: "airflow.scheduler.tasks.starving"
    name: "airflow_scheduler_tasks_starving"
    labels: {}

  - match: "airflow.scheduler.tasks.executable"
    name: "airflow_scheduler_tasks_executable"
    labels: {}

  - match: "airflow.scheduler.critical_section_duration"
    name: "airflow_scheduler_critical_section_duration"
    timer_type: summary
    labels: {}

  - match: "airflow.dag_processing.total_parse_time"
    name: "airflow_dag_processing_total_parse_time"
    labels: {}

  - match: "airflow.dag_processing.processes"
    name: "airflow_dag_processing_processes"
    labels: {}

  - match: "airflow.dag_processing.processor_timeouts"
    name: "airflow_dag_processing_processor_timeouts"
    labels: {}

  - match: "airflow.dag_processing.last_duration.*"
    name: "airflow_dag_processing_last_duration_seconds"
    labels:
      dag_file: "$1"

  - match: "airflow.dag_processing.last_run.seconds_ago.*"
    name: "airflow_dag_processing_last_run_seconds_ago"
    labels:
      dag_file: "$1"

  - match: "airflow.dagrun.dependency_check.*"
    name: "airflow_dagrun_dependency_check_ms"
    timer_type: summary
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_success_ms"
    timer_type: summary
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_failed_ms"
    timer_type: summary
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.schedule_delay.*"
    name: "airflow_dagrun_schedule_delay_ms"
    timer_type: summary
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.*.first_task_scheduling_delay"
    name: "airflow_dagrun_first_task_scheduling_delay_ms"
    timer_type: summary
    labels:
      dag_id: "$1"

  - match: "airflow.task_instance_created.*"
    name: "airflow_task_instance_created"
    labels:
      operator: "$1"

  - match: "airflow.task.duration.*.*"
    name: "airflow_task_duration_ms"
    timer_type: summary
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.task.queued_duration.*.*"
    name: "airflow_task_queued_duration_ms"
    timer_type: summary
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.task_removed_from_dag.*"
    name: "airflow_task_removed_from_dag"
    labels:
      dag_id: "$1"

  - match: "airflow.task_restored_to_dag.*"
    name: "airflow_task_restored_to_dag"
    labels:
      dag_id: "$1"

  - match: "airflow.operator_successes.*"
    name: "airflow_operator_successes"
    labels:
      operator: "$1"

  - match: "airflow.operator_failures.*"
    name: "airflow_operator_failures"
    labels:
      operator: "$1"

  - match: "airflow.pool.open_slots.*"
    name: "airflow_pool_open_slots"
    labels:
      pool: "$1"

  - match: "airflow.pool.used_slots.*"
    name: "airflow_pool_used_slots"
    labels:
      pool: "$1"

  - match: "airflow.pool.queued_slots.*"
    name: "airflow_pool_queued_slots"
    labels:
      pool: "$1"

  - match: "airflow.pool.starving_tasks.*"
    name: "airflow_pool_starving_tasks"
    labels:
      pool: "$1"

  - match: "airflow.executor.running_tasks"
    name: "airflow_executor_running_tasks"
    labels: {}

  - match: "airflow.executor.queued_tasks"
    name: "airflow_executor_queued_tasks"
    labels: {}

  - match: "airflow.executor.open_slots"
    name: "airflow_executor_open_slots"
    labels: {}

  - match: "airflow.celery.queue_length.*"
    name: "airflow_celery_queue_length"
    labels:
      queue: "$1"

  - match: "airflow.triggers.running"
    name: "airflow_triggers_running"
    labels: {}

  - match: "airflow.triggers.succeeded_count"
    name: "airflow_triggers_succeeded_count"
    labels: {}

  - match: "airflow.triggers.failed_count"
    name: "airflow_triggers_failed_count"
    labels: {}

  - match: "airflow.triggers.blocked_main_thread"
    name: "airflow_triggers_blocked_main_thread"
    labels: {}
