[project]
name = "artemis"
version = "0.1.0"
description = "Airflow and dbt sandbox for local development and testing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.0.6",
    "apache-airflow-providers-hashicorp>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artemis"]

[tool.black]
line-length = 88
