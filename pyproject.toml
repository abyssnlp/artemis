[project]
name = "artemis"
version = "0.1.0"
description = "Airflow and dbt sandbox for local development and testing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.0.6",
    "apache-airflow-providers-hashicorp",
    "apache-airflow-providers-elasticsearch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artemis"]

[tool.black]
line-length = 88

[dependency-groups]
dev = [
    "codespell>=2.4.2",
    "pyright>=1.1.408",
    "ruff>=0.15.9",
]

[tool.ruff]
exclude = [
    ".github",
    ".venv",
    "dist",
    "build",
    ".eggs",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "venv",
    ".tox",
    ".pytype"
]

line-length = 88
indent-width = 4

# Rules: https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "AIR"]
ignore = []
fixable = ["ALL"]
unfixable = ["AIR"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
    "testing"
]
known-first-party = ["artemis"]

[tool.ruff.lint.isort.sections]
testing = ["tests", "unit", "integration"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"

# microsoft.github.io/pyright/#/type-concepts
[tool.pyright]
include = ["artemis", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", "**/.pytest_cache", "**/.ruff_cache", "**/.vscode", "**/venv", "**/.tox", "**/.pytype"]
enableExperimentalFeatures = true
reportMissingImports = "error"
reportMissingTypeStubs = false
pythonVersion = "3.12"
pythonPlatform = "Linux"

[tool.codespell]
skip = ".git,.venv,dist,build,uv.lock,__pycache__,.pytest_cache,venv"
ignore-words-list = "ser,deser"
