[project]
name = "artemis"
version = "0.1.0"
description = "Airflow and dbt sandbox for local development and testing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.0.6",
    "apache-airflow-providers-hashicorp",
    "apache-airflow-providers-elasticsearch",
    "dbt-core>=1.11.8",
    "dbt-clickhouse>=1.10.0",
    "astronomer-cosmos>=1.14.0",
    "requests>=2.33.1",
    "clickhouse-connect>=0.15.1",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artemis"]

[tool.black]
line-length = 88

[dependency-groups]
dev = [
    "codespell>=2.4.2",
    "pyright>=1.1.408",
    "ruff>=0.15.9",
    "sqlfluff>=4.1.0",
    "sqlfluff-templater-dbt>=4.1.0",
]

[tool.ruff]
exclude = [
    ".github",
    ".venv",
    "dist",
    "build",
    ".eggs",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "venv",
    ".tox",
    ".pytype"
]

line-length = 88
indent-width = 4

# Rules: https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "AIR"]
ignore = []
fixable = ["ALL"]
unfixable = ["AIR"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
    "testing"
]
known-first-party = ["artemis"]

[tool.ruff.lint.isort.sections]
testing = ["tests", "unit", "integration"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"

# microsoft.github.io/pyright/#/type-concepts
[tool.pyright]
include = ["artemis", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", "**/.pytest_cache", "**/.ruff_cache", "**/.vscode", "**/venv", "**/.tox", "**/.pytype"]
enableExperimentalFeatures = true
reportMissingImports = "error"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Linux"

[tool.codespell]
skip = ".git,.venv,dist,build,uv.lock,__pycache__,.pytest_cache,venv,constraints-3.12.txt"
ignore-words-list = "ser,deser"

# SQLFluff
[tool.sqlfluff.core]
templater = "dbt"
dialect = "clickhouse"
sql_file_exts = ".sql,.sql.j2"

[tool.sqlfluff.rules.references.keywords]
ignore_words = "id"

[tool.sqlfluff.rules.capitalisation.keywords]
captalisation_policy = "upper"

[tool.sqlfluff.templater.dbt]
project_dir = "dbt/f1"
profile = "clickhouse"
target = "dev"

[tool.sqlfluff.templater]
unwrap_wrapped_queries = true
